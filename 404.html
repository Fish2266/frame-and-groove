<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — Frame &amp; Groove</title>
  <style>
    html { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      background: #12161A; color: #EEF2F4;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      text-align: center; padding: 24px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #94A2AC; margin: 0 0 20px; max-width: 32em; }
    a {
      display: inline-block; padding: 10px 18px; border-radius: 8px;
      background: #3FD98B; color: #0C1013; font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>There is nothing at this address</h1>
    <p>Frame &amp; Groove is one page — every section of the studio lives inside it,
       so there are no other URLs to land on.</p>
    <a id="home" href="/">Open the studio</a>
  </main>
  <script>
    /* Pages keeps the requested URL when it serves this file, so "./" would
       point at whatever folder the visitor mistyped. On a project site the
       studio lives one segment down (user.github.io/<repo>/); on a user site
       it is at the root. */
    (function () {
      var seg = location.pathname.split('/').filter(Boolean);
      var projectSite = /\.github\.io$/.test(location.hostname) && seg.length > 1;
      document.getElementById('home').href = projectSite ? '/' + seg[0] + '/' : '/';
    })();
  </script>
</body>
</html>
